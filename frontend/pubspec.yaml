name: flutter_app
description: A Flutter business management application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  file_picker: ^8.1.7

  # Google Fonts for modern typography
  google_fonts: ^6.3.0

  # Searchable dropdown for Time Zone and other dropdown fields
  dropdown_search: ^6.0.2

  # Animations
  flutter_animate: ^4.5.2
  flutter_quill: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/widgets/Codexia_OG1.8.png
    - assets/images/codexia_hero.png

  # Uncomment this section only if you have assets
  #
  # assets:
  #   - assets/images/
  #   - assets/icons/
  